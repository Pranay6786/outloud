<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Express starter</title>
    <meta
      name="description"
      content="A minimal Express server serving a plain HTML page."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #18202a;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 560px);
        padding: 40px;
        background: #fff;
        border: 1px solid #dce4ee;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgb(27 47 73 / 10%);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #3874c9;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.04em;
      }

      p {
        color: #5d6b7c;
        line-height: 1.6;
      }

      form {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      label {
        font-size: 0.9rem;
        font-weight: 650;
      }

      input,
      button {
        width: 100%;
        border-radius: 9px;
        font: inherit;
      }

      input {
        padding: 12px 13px;
        border: 1px solid #c8d3e1;
        background: #fbfcfe;
      }

      input:focus {
        outline: 3px solid rgb(56 116 201 / 20%);
        border-color: #3874c9;
      }

      button {
        margin-top: 6px;
        padding: 12px 16px;
        border: 0;
        color: #fff;
        background: #3874c9;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover {
        background: #2d61aa;
      }

      #result {
        min-height: 1.5em;
        margin: 18px 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Node.js · Express</p>
      <h1>Plain HTML, served simply.</h1>
      <p>
        This page is served directly from the <code>public</code> folder.
        Submit a message to try the server's POST endpoint.
      </p>

      <form id="message-form" action="/submit" method="post">
        <label for="message">Message</label>
        <input
          id="message"
          name="message"
          type="text"
          placeholder="Hello from the browser"
          required
        />
        <button type="submit">Send to Express</button>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
    </main>

    <script>
      const form = document.querySelector("#message-form");
      const result = document.querySelector("#result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Sending...";

        try {
          const response = await fetch(form.action, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: new FormData(form).get("message"),
            }),
          });
          const payload = await response.json();
          result.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          result.textContent = "Request failed. Check the server and try again.";
        }
      });
    </script>
  </body>
</html>
