kind = "web"
previewPath = "/"
title = "Minimal Express Web App"
description = "A minimal Node.js Express server that serves a plain HTML page from a public folder and exposes one POST endpoint."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
run = [ "pnpm", "--filter", "@workspace/web", "run", "start" ]

[services.env]
PORT = "22333"
BASE_PATH = "/"
